name: Upstream drift

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open an issue only if upstream moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream.mjs
